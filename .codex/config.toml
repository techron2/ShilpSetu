[mcp_servers.playwright]
command = "npx"
args = [
  "-y",
  "@playwright/mcp@latest",
  "--browser",
  "chrome",
  "--mobile",
  "--viewport-size",
  "412x915",
  "--isolated",
  "--snapshot-boxes",
  "--output-dir",
  "output/playwright/mcp",
]
startup_timeout_sec = 90
tool_timeout_sec = 90

[mcp_servers.chrome_devtools]
command = "npx"
args = [
  "-y",
  "chrome-devtools-mcp@latest",
  "--isolated",
  "--viewport",
  "412x915",
  "--no-usage-statistics",
]
startup_timeout_sec = 90
tool_timeout_sec = 90
